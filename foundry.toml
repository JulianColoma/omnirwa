[profile.default]
src = "contracts"          # la consigna exige /contracts
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200       # si el Governor supera 24 KB, bajar (ej. 1)
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
# immutables públicos en camelCase (paymentToken, tokenizer, assetId) son parte de la API que lee el frontend;
# CLOCK_MODE() es el nombre exigido por ERC-6372.
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-function"]

[fuzz]
runs = 256

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
